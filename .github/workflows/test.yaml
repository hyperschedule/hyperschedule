name: Run all automated checks

on:
    push:
        branches:
            - "*"
    pull_request:
        branches:
            - "v2"
    workflow_dispatch:

jobs:
    run:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                # we use matrix so we can run those in parallel
                command:
                    ["typecheck", "test", "lint", "format", "audit", "build"]
        steps:
            - uses: actions/checkout@v7
              with:
                  lfs: true
            - name: Install pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 10.34.8
            - name: Use patched Node.js 26
              uses: actions/setup-node@v7
              with:
                  node-version-file: .node-version
                  cache: "pnpm"
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Run ${{matrix.command}}
              run: pnpm ci:${{matrix.command}}

    images:
        name: image (${{ matrix.image }})
        runs-on: ubuntu-latest
        timeout-minutes: 45
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                include:
                    - image: base
                      dockerfile: base.dockerfile
                    - image: mongo
                      dockerfile: mongo.dockerfile
                    - image: nginx
                      dockerfile: nginx.dockerfile
                    - image: devcontainer
                      dockerfile: dev-container.dockerfile
        steps:
            - uses: actions/checkout@v7
              with:
                  lfs: true
            - name: Build application base for development container
              if: matrix.image == 'devcontainer'
              run: docker build --tag hyperschedule-dev-base --file base.dockerfile .
            - name: Build image
              run: docker build --tag hyperschedule-ci-${{ matrix.image }} --file '${{ matrix.dockerfile }}' .
            - name: Scan all packages and severities
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                  version: v0.72.0
                  image-ref: hyperschedule-ci-${{ matrix.image }}
                  scanners: vuln
                  format: json
                  output: vulnerabilities-${{ matrix.image }}.json
                  severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
                  ignore-unfixed: "false"
                  exit-code: "0"
                  timeout: 10m
              env:
                  TRIVY_IGNOREFILE: /dev/null
            - name: Retain full vulnerability report
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: vulnerabilities-${{ matrix.image }}
                  path: vulnerabilities-${{ matrix.image }}.json
                  retention-days: 30
                  if-no-files-found: warn
            - name: Reject high and critical vulnerabilities
              env:
                  REPORT: vulnerabilities-${{ matrix.image }}.json
              run: |
                  python3 - <<'PY'
                  import json
                  import os

                  with open(os.environ['REPORT']) as source:
                      report = json.load(source)
                  assert report.get('Metadata', {}).get('ImageID'), 'Missing scanned image identity'
                  assert report.get('Results'), 'Missing package scan results'
                  findings = [
                      (result['Target'], finding)
                      for result in report['Results']
                      for finding in (result.get('Vulnerabilities') or [])
                      if finding['Severity'] in ('HIGH', 'CRITICAL')
                  ]
                  for target, finding in findings:
                      print(f"{finding['Severity']} {finding['VulnerabilityID']} {finding['PkgName']} in {target}")
                  print(f'{len(findings)} high/critical findings')
                  raise SystemExit(bool(findings))
                  PY
            - name: Validate development runtime with existing checks
              if: matrix.image == 'devcontainer'
              run: |
                  docker run --rm hyperschedule-ci-devcontainer bash -euc '
                    node --version
                    pnpm install --frozen-lockfile
                    pnpm ci:test
                    pnpm ci:typecheck
                    pnpm ci:build
                    zsh -ic "command -v git; docker --version; docker compose version"
                  '
